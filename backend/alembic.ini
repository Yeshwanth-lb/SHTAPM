[alembic]
# script_location was `alembic` — CWD-relative, so running
# `alembic -c backend/alembic.ini upgrade head` from the repo root looked for
# <repo>/alembic and failed with "Path doesn't exist"; only `cd backend` first
# worked. %(here)s is the directory holding THIS file, so the script directory
# now resolves correctly from any working directory.
script_location = %(here)s/alembic
# NOTE: %(here)s is NOT interpolated for prepend_sys_path (verified — alembic
# applies it to script_location only), so this stays CWD-relative and only
# puts backend/ on sys.path when run from backend/. env.py needs `app` on the
# path, so from the repo root you must still pass PYTHONPATH:
#   PYTHONPATH=backend:. alembic -c backend/alembic.ini upgrade head   (POSIX)
#   PYTHONPATH="backend;." alembic -c backend/alembic.ini upgrade head (Windows)
# Running from backend/ needs no PYTHONPATH.
prepend_sys_path = .

# sqlalchemy.url is intentionally NOT set here — env.py reads DATABASE_URL
# from the environment (same variable the running app uses) so migrations
# never drift from the app's own config, and no DB URL is committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
