# SHTAPM — monorepo Python tooling root (ruff/black/pytest).
# Runtime dependencies for the edge and backend services live in their own
# service directories and are pinned in their phases (edge: P1–P3, backend: P4).
# This root file only configures the shared toolchain (frozen stack, TRD §02.2).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shtapm"
version = "0.0.0"
description = "Self-Healing Trust-Aware Predictive Maintenance (SHTAPM) — monorepo tooling root"
requires-python = ">=3.11"

# This root is a tooling/deps UMBRELLA, not a distributable package. Opt out of
# setuptools flat-layout auto-discovery (which would otherwise try to bundle
# backend/, edge/, simulator/, frontend/, infra/ into one wheel and fail). The
# service directories are NOT packaged here; each stays independent.
[tool.setuptools]
py-modules = []

[project.optional-dependencies]
dev = [
  "ruff==0.6.*",
  "black==24.*",
  "pytest==8.*",
  "pydantic[email]==2.*",  # required by the shared-contract test suite (D006/D007); [email] for P4-M4 users API
  "httpx",          # FastAPI TestClient (M3.3 app health test)
  "sqlalchemy==2.0.*",  # P4 ORM models (backend/tests/test_models.py, SQLite-portable)
  "python-jose[cryptography]==3.3.*",  # P4-M2 JWT access tokens
  "passlib[bcrypt]==1.7.*",            # P4-M2 password hashing
  "bcrypt==4.0.1",                     # pinned: passlib 1.7.4 breaks on bcrypt>=4.1
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's own documented DI idiom is `Depends(...)` as an argument default —
# not the footgun B008 targets (a fresh mutable default). Applies to routers,
# dependency modules, and tests that define inline probe routes.
"backend/app/api/*.py" = ["B008"]
"backend/tests/test_auth_api.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(frontend|\\.venv|venv)/"

[tool.pytest.ini_options]
testpaths = ["edge/tests", "backend/tests", "simulator/tests"]
python_files = "test_*.py"
# backend/ → import `app.schemas`; "." → import `simulator`. importlib mode lets
# same-basename test files (test_placeholder.py in edge/ and backend/) coexist.
pythonpath = ["backend", "."]
addopts = "--import-mode=importlib"
markers = [
  "integration: requires a running MQTT broker (skips if none reachable)",
  "db_integration: requires a running Postgres/TimescaleDB (skips if none reachable)",
]
