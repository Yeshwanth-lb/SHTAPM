# ─────────────────────────────────────────────────────────────────────────
# SHTAPM — P0 offline four-service stack (TRD §02.5).
#
#   mosquitto  — MQTT broker (official image + infra/mosquitto/mosquitto.conf)
#   db         — PostgreSQL/TimescaleDB (running but UNUSED by the app at P0;
#                persistence + schema are P4)
#   backend    — FastAPI (MQTT telemetry ingestion + WebSocket /ws + /healthz)
#   frontend   — React live-telemetry app, built and served static via nginx
#
# `docker compose up` starts all four. Telemetry source (the hardware-free
# simulator, D008) is run SEPARATELY on the host — it is NOT a compose service.
# Offline rule (TRD §02.5): images are cached locally for the demo; building the
# frontend image needs the npm registry once, then runs offline.
# ─────────────────────────────────────────────────────────────────────────
name: shtapm

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  db:
    image: timescale/timescaledb:2.14.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shtapm}
      POSTGRES_USER: ${POSTGRES_USER:-shtapm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shtapm} -d ${POSTGRES_DB:-shtapm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # FastAPI (app.main:app): MQTT telemetry ingestion + WebSocket fan-out.
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    # React live-telemetry app built + served static by nginx (port 80).
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mosquitto_data:
  mosquitto_log:
  db_data:
