name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev]" -r backend/requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  frontend:
    name: Frontend typecheck + test + build
    runs-on: ubuntu-latest
    # M3.5: no lockfile yet (npm is blocked in the dev sandbox, so it could not
    # be generated locally). CI has network → `npm install` resolves the pins,
    # then runs the RTL/typecheck/build gate (Option A). A committed lockfile +
    # lint/format come in P5.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
