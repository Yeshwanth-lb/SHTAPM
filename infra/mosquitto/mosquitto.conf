# SHTAPM Mosquitto broker — P0 foundation.
#
# DEV ONLY: anonymous access is enabled for local offline bring-up so the
# infra can start before auth exists. P4 hardens this with credentials/ACL
# per PRD Appendix E (MQTT username/password, TLS where supported).
#
# Topics (for reference — publishers/subscribers implemented in P1/P4):
#   shtapm/{device_id}/telemetry   (1 Hz, QoS 0)
#   shtapm/{device_id}/decision    (QoS 1)
#   shtapm/{device_id}/ledger      (QoS 1)
#   shtapm/{device_id}/command     (backend→edge advisory, QoS 1)
#   shtapm/{device_id}/status      (retained LWT online/offline, QoS 1)

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
