# SHTAPM frontend — minimal SPA static serving (P0 offline-stack gate).
# Single-page app: serve built assets, fall back to index.html for client routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
